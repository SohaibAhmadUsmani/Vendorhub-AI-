<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120" fill="none">
  <defs>
    <!-- Main Ribbon Gradient 1 -->
    <linearGradient id="favRibbon1" x1="14" y1="24" x2="186" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="30%" stop-color="#C084FC" />
      <stop offset="65%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <!-- Main Ribbon Gradient 2 -->
    <linearGradient id="favRibbon2" x1="186" y1="24" x2="14" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="35%" stop-color="#A855F7" />
      <stop offset="75%" stop-color="#7E22CE" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <!-- Glossy Highlight -->
    <linearGradient id="favHighlight" x1="30" y1="24" x2="90" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E9D5FF" stop-opacity="0" />
    </linearGradient>

    <filter id="favDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7E22CE" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Transparent Clean Infinity Emblem for Browser Tab -->
  <g filter="url(#favDropShadow)">
    <!-- Outer Loop -->
    <path 
      d="M 60,24 
         C 34,24 14,40 14,60 
         C 14,80 34,96 60,96 
         C 78,96 95,85 107,69 
         C 119,85 136,96 154,96 
         C 180,96 200,80 200,60 
         C 200,40 180,24 154,24 
         C 136,24 119,35 107,51 
         C 95,35 78,24 60,24 Z 
         M 60,42 
         C 71,42 84,50 94,60 
         C 84,70 71,78 60,78 
         C 49,78 36,70 26,60 
         C 36,50 49,42 60,42 Z 
         M 154,42 
         C 165,42 178,50 188,60 
         C 178,70 165,78 154,78 
         C 143,78 130,70 120,60 
         C 130,50 143,42 154,42 Z" 
      fill="url(#favRibbon1)"
    />

    <!-- Overlapping Fold -->
    <path 
      d="M 107,51 
         C 119,35 136,24 154,24 
         C 180,24 200,40 200,60 
         C 200,74 190,86 174,92 
         L 164,74 
         C 174,70 182,63 182,60 
         C 182,49 170,42 154,42 
         C 143,42 131,48 121,57 
         L 107,51 Z" 
      fill="url(#favRibbon2)"
    />

    <!-- Glossy Highlight Curve -->
    <path 
      d="M 60,24 C 42,24 25,32 18,46 C 25,36 40,28 60,28 C 76,28 91,37 102,50 L 107,44 C 95,31 78,24 60,24 Z" 
      fill="url(#favHighlight)" 
    />
  </g>
</svg>